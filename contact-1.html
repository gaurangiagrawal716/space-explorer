<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Space Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="logo">Space Explorer</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="planets.html">Planets</a>
      <a href="missions.html">Missions</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Send us a message</h1>
    <p>Share your favorite space fact or ask a question.</p>
    <p>
      <label for="name">Your name</label><br>
      <input id="name" type="text" style="padding:8px;width:100%;max-width:400px;">
    </p>
    <p>
      <label for="message">Message</label><br>
      <textarea id="message" rows="4" style="padding:8px;width:100%;max-width:400px;"></textarea>
    </p>
    <button class="button" id="send" style="border:0;cursor:pointer;">Send message</button>
    <p id="result"></p>
  </main>

  <footer>
    <p>&copy; 2026 Space Explorer. A multi-page HTML project.</p>
  </footer>

  <script>
    // Replace this with your hosted backend link later
    const BACKEND_URL = "http://127.0.0.1:5000";

    document.getElementById("send").addEventListener("click", async () => {
      const result = document.getElementById("result");
      try {
        const res = await fetch(BACKEND_URL + "/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            message: document.getElementById("message").value
          })
        });
        const data = await res.json();
        result.textContent = data.status || data.error;
      } catch (e) {
        result.textContent = "Could not reach the server. Try again later.";
      }
    });
  </script>
</body>
</html>
